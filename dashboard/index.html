<!DOCTYPE html><html><head><meta charset="utf-8"><title>Smart Manufacturing Pattern Discovery</title><style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:24px}
h1{color:#38bdf8;margin:0 0 16px;font-size:26px}
h3{color:#7dd3fc;margin:0 0 12px;font-size:17px}
.controls{background:#1e293b;padding:16px;border-radius:10px;border:1px solid #334155;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#94a3b8}
input,select{background:#0f172a;color:#e2e8f0;border:1px solid #475569;padding:8px 10px;border-radius:6px;font-size:13px;width:130px}
button{background:#0284c7;color:#fff;border:none;padding:9px 16px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:13px}
button:hover{background:#0369a1}
.sim-out{width:100%;padding:10px 14px;border-radius:6px;background:#0f172a;border-left:4px solid #38bdf8;font-size:13px;display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:20px}
.card{background:#1e293b;padding:18px;border-radius:10px;border:1px solid #334155;overflow-x:auto}
.kpi-title{color:#94a3b8;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.kpi{font-size:30px;color:#38bdf8;font-weight:bold;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th{background:#0f172a;color:#94a3b8;text-align:left;padding:8px 10px;border-bottom:1px solid #334155}
td{padding:8px 10px;border-bottom:1px solid #283548}
tr:hover td{background:#263348}
</style></head>
<body>
<h1>Smart Manufacturing Pattern Discovery</h1>
<div class="controls">
  <div class="field"><label>Filter Line</label><select id="lineFilter" onchange="render()"><option value="ALL">All Lines</option><option value="LINE-A">LINE-A</option><option value="LINE-B">LINE-B</option><option value="LINE-C">LINE-C</option></select></div>
  <div class="field"><label>Machine ID</label><input id="inMac" value="M-04"></div>
  <div class="field"><label>Temp (°C)</label><input id="inTemp" type="number" step="0.1" value="112.5"></div>
  <div class="field"><label>Vibration</label><input id="inVib" type="number" step="0.1" value="7.4"></div>
  <div class="field"><label>Load (%)</label><input id="inLoad" type="number" step="0.1" value="84"></div>
  <button onclick="runCheck()">Analyze Sensor Input</button>
  <div id="simOut" class="sim-out"></div>
</div>
<div id="kpis" class="kpis"></div>
<div id="panels" class="panels"></div>
<script>
var x=new XMLHttpRequest();x.open("GET","patterns.json",false);x.send();var d=JSON.parse(x.responseText);
function k(t,v){return"<div class=card><div class=kpi-title>"+t+"</div><div class=kpi>"+v+"</div></div>";}
function tbl(t,r){if(!r.length)return"<div class=card><h3>"+t+"</h3><p style='color:#94a3b8'>No matching rows</p></div>";var ks=Object.keys(r[0]),h="<tr>";ks.forEach(function(c){h+="<th>"+c+"</th>";});h+="</tr>";r.slice(0,8).forEach(function(row){h+="<tr>";ks.forEach(function(c){h+="<td>"+row[c]+"</td>";});h+="</tr>";});return"<div class=card><h3>"+t+"</h3><table>"+h+"</table></div>";}
function render(){
  var lf=document.getElementById("lineFilter").value;
  var mb=lf=="ALL"?d.machine_behaviour:d.machine_behaviour.filter(function(r){return r.production_line==lf;});
  var an=lf=="ALL"?d.anomalies_detected:d.anomalies_detected.filter(function(r){return r.production_line==lf;});
  var sc=d.sensor_relationships.filter(function(r){return r.strength=="Strong"&&r.sensor_x!=r.sensor_y;});
  document.getElementById("kpis").innerHTML=k("Machines",mb.length)+k("Strong Links",sc.length)+k("Assoc Rules",d.association_rules.length)+k("Anomalies",an.length);
  document.getElementById("panels").innerHTML=tbl("Machine Behaviour",mb)+tbl("Sensor Links",sc)+tbl("Association Rules",d.association_rules)+tbl("Production Efficiency",d.production_patterns)+tbl("Temporal Shifts",d.temporal_patterns)+tbl("Anomalies",an);
}
function runCheck(){
  var m=document.getElementById("inMac").value,t=parseFloat(document.getElementById("inTemp").value),v=parseFloat(document.getElementById("inVib").value),l=parseFloat(document.getElementById("inLoad").value);
  var tz=((t-72)/8.2).toFixed(2),vz=((v-3.1)/0.85).toFixed(2),alert=(Math.abs(tz)>2.5||Math.abs(vz)>2.5);
  var out=document.getElementById("simOut");out.style.display="block";
  out.style.borderLeftColor=alert?"#ef4444":"#22c55e";
  out.innerHTML=(alert?"<b style='color:#f87171'>WARNING — Sensor_Surge Detected!</b> Check <b>"+m+"</b> before it breaks! ":"<b style='color:#4ade80'>NORMAL — Healthy Operating State:</b> ")+"Temp Z-Score = <b>"+tz+"</b>, Vibration Z-Score = <b>"+vz+"</b>, Load Regime = <b>"+(l>75?"OVERLOAD (High)":"OPTIMAL (Medium)")+"</b>";
  if(alert){d.anomalies_detected.unshift({anomaly_type:"Sensor_Surge (Live)",production_line:document.getElementById("lineFilter").value=="ALL"?"LINE-A":document.getElementById("lineFilter").value,vibration:v,timestamp:"LIVE-TEST",temp_z:tz,machine_id:m,vib_z:vz,temperature:t});render();}
}
render();
</script></body></html>
