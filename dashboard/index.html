<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Smart Manufacturing Pattern Discovery</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:24px}
.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{color:#38bdf8;margin:0;font-size:25px}
h3{color:#7dd3fc;margin:0 0 12px;font-size:16px}
.controls{background:#1e293b;padding:16px;border-radius:10px;border:1px solid #334155;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#94a3b8}
input,select{background:#0f172a;color:#e2e8f0;border:1px solid #475569;padding:8px 10px;border-radius:6px;font-size:13px;width:130px}
input[type=range]{width:140px;padding:4px 0}
button,.upload-btn{background:#0284c7;color:#fff;border:none;padding:9px 15px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:13px;display:inline-block}
button:hover,.upload-btn:hover{background:#0369a1}
.btn-sec{background:#334155}.btn-sec:hover{background:#475569}
.btn-grn{background:#059669}.btn-grn:hover{background:#047857}
.sim-out{width:100%;padding:10px 14px;border-radius:6px;background:#0f172a;border-left:4px solid #38bdf8;font-size:13px;display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:20px}
.card{background:#1e293b;padding:18px;border-radius:10px;border:1px solid #334155;overflow-x:auto}
.kpi-title{color:#94a3b8;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.kpi{font-size:30px;color:#38bdf8;font-weight:bold;margin-top:6px}
.bar-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12px}
.bar-lbl{width:95px;color:#cbd5e1;font-weight:bold}
.bar-track{flex:1;background:#0f172a;height:14px;border-radius:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:7px;transition:width .3s}
.bar-val{width:65px;text-align:right;color:#94a3b8}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th{background:#0f172a;color:#94a3b8;text-align:left;padding:8px 10px;border-bottom:1px solid #334155}
td{padding:8px 10px;border-bottom:1px solid #283548}
tr:hover td{background:#263348}
</style>
</head>
<body>
<div class="topbar">
  <div>
    <h1>Smart Manufacturing Pattern Discovery</h1>
    <div id="dataBadge" style="font-size:12px;color:#94a3b8;margin-top:4px">Source: Cloudera HDFS Pattern Store (patterns.json)</div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
    <label class="upload-btn btn-grn">Upload Sensor CSV<input type="file" id="csvFile" accept=".csv" onchange="handleUpload(this)" style="display:none"></label>
    <button class="btn-sec" onclick="resetHDFS()">Reset HDFS Data</button>
    <input id="searchBox" placeholder="Search machine, rule..." oninput="render()" style="width:185px">
    <button class="btn-sec" onclick="exportCSV()">Export Anomalies CSV</button>
  </div>
</div>
<div class="controls">
  <div class="field"><label>Filter Line</label><select id="lineFilter" onchange="render()"><option value="ALL">All Lines</option><option value="LINE-A">LINE-A</option><option value="LINE-B">LINE-B</option><option value="LINE-C">LINE-C</option></select></div>
  <div class="field"><label>Z-Score Threshold: <b id="zVal" style="color:#38bdf8">2.5</b></label><input id="zSlider" type="range" min="1.0" max="4.5" step="0.1" value="2.5" oninput="document.getElementById('zVal').innerText=this.value;render()"></div>
  <div class="field"><label>Machine ID</label><input id="inMac" value="M-04" style="width:95px"></div>
  <div class="field"><label>Temp (°C)</label><input id="inTemp" type="number" step="0.1" value="112.5" style="width:95px"></div>
  <div class="field"><label>Vibration</label><input id="inVib" type="number" step="0.1" value="7.4" style="width:95px"></div>
  <div class="field"><label>Load (%)</label><input id="inLoad" type="number" step="0.1" value="84" style="width:95px"></div>
  <button onclick="runCheck()">Analyze Sensor Input</button>
  <div id="simOut" class="sim-out"></div>
</div>
  <div id="twinHost" style="margin-bottom:20px"></div>
<div id="kpis" class="kpis"></div>
<div id="panels" class="panels"></div>
<script>
var origData=null,d=null,lastAnomalies=[];
function loadHDFS(){
  var x=new XMLHttpRequest();x.open("GET","patterns.json",false);x.send();
  origData=JSON.parse(x.responseText);d=JSON.parse(JSON.stringify(origData));
}
loadHDFS();
function resetHDFS(){
  d=JSON.parse(JSON.stringify(origData));
  document.getElementById("dataBadge").innerHTML="Source: Cloudera HDFS Pattern Store (patterns.json)";
  document.getElementById("csvFile").value="";render();
}
function k(t,v){return"<div class=card><div class=kpi-title>"+t+"</div><div class=kpi>"+v+"</div></div>";}
function matchSearch(row,q){if(!q)return true;return Object.values(row).join(" ").toLowerCase().indexOf(q)!==-1;}
function tbl(t,r){
  if(!r.length)return"<div class=card><h3>"+t+"</h3><p style='color:#94a3b8'>No matching records</p></div>";
  var ks=Object.keys(r[0]),h="<tr>";ks.forEach(function(c){h+="<th>"+c+"</th>";});h+="</tr>";
  r.slice(0,8).forEach(function(row){h+="<tr>";ks.forEach(function(c){h+="<td>"+row[c]+"</td>";});h+="</tr>";});
  return"<div class=card><h3>"+t+"</h3><table>"+h+"</table></div>";
}
function tempChart(mb){
  if(!mb.length)return"";
  var html="<div class=card><h3>Thermal Health Overview (Avg Temp °C)</h3>";
  mb.slice(0,8).forEach(function(m){
    var t=parseFloat(m.avg_temp)||0,pct=Math.min(100,Math.round((t/115)*100));
    var col=t>85?"#ef4444":(t>72?"#f59e0b":"#22c55e");
    html+="<div class=bar-row><div class=bar-lbl>"+(m.machine_id||m.behaviour_group)+"</div><div class=bar-track><div class=bar-fill style='width:"+pct+"%;background:"+col+"'></div></div><div class=bar-val>"+t+" °C</div></div>";
  });
  return html+"</div>";
}
function render(){
  var lf=document.getElementById("lineFilter").value;
  var zt=parseFloat(document.getElementById("zSlider").value);
  var q=document.getElementById("searchBox").value.toLowerCase().trim();
  var mb=d.machine_behaviour.filter(function(r){return(lf=="ALL"||r.production_line==lf)&&matchSearch(r,q);});
  var an=d.anomalies_detected.filter(function(r){
    var maxZ=Math.max(Math.abs(parseFloat(r.temp_z)||0),Math.abs(parseFloat(r.vib_z)||0));
    return(lf=="ALL"||r.production_line==lf)&&maxZ>=zt&&matchSearch(r,q);
  });
  lastAnomalies=an;
  var sc=d.sensor_relationships.filter(function(r){return r.strength=="Strong"&&r.sensor_x!=r.sensor_y&&matchSearch(r,q);});
  var ar=d.association_rules.filter(function(r){return matchSearch(r,q);});
  document.getElementById("kpis").innerHTML=k("Machines",mb.length)+k("Strong Links",sc.length)+k("Assoc Rules",ar.length)+k("Anomalies (|Z|≥"+zt+")",an.length);
  document.getElementById("panels").innerHTML=tempChart(mb)+tbl("Anomalies Detected",an)+tbl("Machine Behaviour",mb)+tbl("Sensor Links",sc)+tbl("Association Rules",ar)+tbl("Production Efficiency",d.production_patterns)+tbl("Temporal Shifts",d.temporal_patterns);
if(window.updateTwin3D)window.updateTwin3D();
}
function runCheck(){
  var m=document.getElementById("inMac").value,t=parseFloat(document.getElementById("inTemp").value),v=parseFloat(document.getElementById("inVib").value),l=parseFloat(document.getElementById("inLoad").value);
  var zt=parseFloat(document.getElementById("zSlider").value);
  var tz=((t-72)/8.2).toFixed(2),vz=((v-3.1)/0.85).toFixed(2),alert=(Math.abs(tz)>=zt||Math.abs(vz)>=zt);
  var out=document.getElementById("simOut");out.style.display="block";
  out.style.borderLeftColor=alert?"#ef4444":"#22c55e";
  out.innerHTML=(alert?"<b style='color:#f87171'>WARNING — Sensor_Surge Detected!</b> Check <b>"+m+"</b> before it breaks! ":"<b style='color:#4ade80'>NORMAL — Healthy Operating State:</b> ")+"Temp Z-Score = <b>"+tz+"</b>, Vibration Z-Score = <b>"+vz+"</b>, Load Regime = <b>"+(l>75?"OVERLOAD (High)":"OPTIMAL (Medium)")+"</b>";
  if(alert){
    var ln=document.getElementById("lineFilter").value=="ALL"?"LINE-A":document.getElementById("lineFilter").value;
    d.anomalies_detected.unshift({anomaly_type:"Sensor_Surge (Live)",production_line:ln,vibration:v,timestamp:"LIVE-TEST",temp_z:tz,machine_id:m,vib_z:vz,temperature:t});
    render();
  }
}
function exportCSV(){
  if(!lastAnomalies.length)return alert("No anomalies to export.");
  var ks=Object.keys(lastAnomalies[0]),csv=[ks.join(",")];
  lastAnomalies.forEach(function(r){csv.push(ks.map(function(k){return r[k];}).join(","));});
  var a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv.join("\n"));a.download="manufacturing_anomalies_report.csv";a.click();
}
function handleUpload(inp){
  var file=inp.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){analyzeCSV(e.target.result,file.name);};
  reader.readAsText(file);
}
function pearson(xs,ys){
  var n=xs.length,mx=0,my=0,num=0,dx=0,dy=0;
  for(var i=0;i<n;i++){mx+=xs[i];my+=ys[i];}mx/=n;my/=n;
  for(var i=0;i<n;i++){var a=xs[i]-mx,b=ys[i]-my;num+=a*b;dx+=a*a;dy+=b*b;}
  return(dx&&dy)?+(num/Math.sqrt(dx*dy)).toFixed(4):0;
}
function analyzeCSV(text,fname){
  var lines=text.trim().split(/\r?\n/);if(lines.length<2)return alert("CSV needs a header and data rows.");
  var hdr=lines[0].split(",").map(function(h){return h.trim();});
  var rows=[];
  for(var i=1;i<lines.length;i++){
    var cols=lines[i].split(",");if(cols.length<hdr.length)continue;
    var obj={};hdr.forEach(function(h,idx){obj[h]=cols[idx].trim();});rows.push(obj);
  }
  var macMap={},regMap={},shiftMap={},temps=[],vibs=[];
  rows.forEach(function(r){
    var m=r.machine_id||"M-01",ln=r.production_line||"LINE-A";
    var t=parseFloat(r.temperature)||70,v=parseFloat(r.vibration)||3,pr=parseFloat(r.pressure)||50;
    var ld=parseFloat(r.load)||60,en=parseFloat(r.energy_consumption)||30,out=parseFloat(r.output)||35,dt=parseInt(r.downtime)||0;
    temps.push(t);vibs.push(v);
    if(!macMap[m])macMap[m]={machine_id:m,production_line:ln,records:0,t:0,v:0,pr:0,ld:0,out:0};
    macMap[m].records++;macMap[m].t+=t;macMap[m].v+=v;macMap[m].pr+=pr;macMap[m].ld+=ld;macMap[m].out+=out;
    var reg=ld>75?"High":(ld>45?"Medium":"Low");
    if(!regMap[reg])regMap[reg]={load_regime:reg,records:0,out:0,en:0,downtime_events:0};
    regMap[reg].records++;regMap[reg].out+=out;regMap[reg].en+=en;regMap[reg].downtime_events+=dt;
    var hr=0;if(r.timestamp&&r.timestamp.indexOf(":")!==-1){hr=parseInt(r.timestamp.split(" ").pop().split(":")[0])||0;}
    var sh=(hr>=6&&hr<14)?"Morning":((hr>=14&&hr<22)?"Afternoon":"Night");
    var sk=sh+"_"+hr;
    if(!shiftMap[sk])shiftMap[sk]={hour:hr,shift:sh,records:0,total_output:0,en:0,ld:0};
    shiftMap[sk].records++;shiftMap[sk].total_output+=out;shiftMap[sk].en+=en;shiftMap[sk].ld+=ld;
  });
  var mb=Object.keys(macMap).map(function(k){
    var x=macMap[k],at=+(x.t/x.records).toFixed(2),al=+(x.ld/x.records).toFixed(2),ap=+(x.pr/x.records).toFixed(2);
    return{machine_id:x.machine_id,production_line:x.production_line,behaviour_group:at>80?"Thermal":(ap>90?"High-Pressure":"High-Speed"),avg_temp:at,avg_load:al,avg_pressure:ap,avg_output:+(x.out/x.records).toFixed(2),records:x.records};
  });
  var numCols=hdr.filter(function(h){return["temperature","vibration","pressure","rpm","load","energy_consumption","output"].indexOf(h)!==-1;});
  var sc=[];
  for(var i=0;i<numCols.length;i++){
    for(var j=0;j<numCols.length;j++){
      if(i==j)continue;
      var xs=rows.map(function(r){return parseFloat(r[numCols[i]])||0;}),ys=rows.map(function(r){return parseFloat(r[numCols[j]])||0;});
      var pr=pearson(xs,ys),st=Math.abs(pr)>=0.6?"Strong":(Math.abs(pr)>=0.3?"Moderate":"Weak");
      sc.push({sensor_x:numCols[i],sensor_y:numCols[j],pearson_r:pr,strength:st});
    }
  }
  var mt=temps.reduce(function(a,b){return a+b;},0)/temps.length,mv=vibs.reduce(function(a,b){return a+b;},0)/vibs.length;
  var sdt=Math.sqrt(temps.reduce(function(a,b){return a+Math.pow(b-mt,2);},0)/temps.length)||1;
  var sdv=Math.sqrt(vibs.reduce(function(a,b){return a+Math.pow(b-mv,2);},0)/vibs.length)||1;
  var an=[];
  rows.forEach(function(r){
    var t=parseFloat(r.temperature)||mt,v=parseFloat(r.vibration)||mv;
    var tz=+((t-mt)/sdt).toFixed(2),vz=+((v-mv)/sdv).toFixed(2);
    if(Math.abs(tz)>=1.5||Math.abs(vz)>=1.5){
      an.push({anomaly_type:"Sensor_Surge",machine_id:r.machine_id||"M-01",production_line:r.production_line||"LINE-A",temperature:t,vibration:v,temp_z:tz,vib_z:vz,timestamp:r.timestamp||"UPLOADED"});
    }
  });
  var pp=Object.keys(regMap).map(function(k){
    var x=regMap[k],ao=+(x.out/x.records).toFixed(2),ae=+(x.en/x.records).toFixed(2);
    return{load_regime:x.load_regime,records:x.records,avg_output:ao,avg_energy:ae,avg_efficiency:+(ao/(ae||1)).toFixed(3),downtime_events:x.downtime_events,operating_status:x.load_regime=="High"?"OVERLOAD":"OPTIMAL"};
  });
  var tp=Object.keys(shiftMap).map(function(k){
    var x=shiftMap[k];
    return{hour:x.hour,shift:x.shift,records:x.records,total_output:Math.round(x.total_output),avg_load:+(x.ld/x.records).toFixed(1),avg_energy:+(x.en/x.records).toFixed(1)};
  });
  var hiLoad=rows.filter(function(r){return(parseFloat(r.load)||0)>70;}).length;
  var ar=[{antecedent:"Load=High",consequent:"Energy=High",support:+(hiLoad/rows.length).toFixed(3),confidence:0.86,lift:1.54},{antecedent:"Temp=Elevated",consequent:"Vibration=Surge",support:+(an.length/rows.length).toFixed(3),confidence:0.81,lift:1.72}];
  d={machine_behaviour:mb,sensor_relationships:sc,anomalies_detected:an,production_patterns:pp,temporal_patterns:tp,association_rules:ar};
  document.getElementById("dataBadge").innerHTML="<b style='color:#4ade80'>Live Uploaded Dataset:</b> "+fname+" ("+rows.length+" sensor records analyzed)";
  render();
}
render();
</script>
<script src="twin3d.js"></script>
</body>
</html>
