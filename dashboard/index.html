<!DOCTYPE html><html><head><meta charset="utf-8"><title>Smart Manufacturing Pattern Discovery</title><style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:24px}
h1{color:#38bdf8;margin:0 0 20px;font-size:26px}
h3{color:#7dd3fc;margin:0 0 12px;font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:20px}
.card{background:#1e293b;padding:18px;border-radius:10px;border:1px solid #334155;overflow-x:auto}
.kpi-title{color:#94a3b8;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.kpi{font-size:30px;color:#38bdf8;font-weight:bold;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th{background:#0f172a;color:#94a3b8;text-align:left;padding:8px 10px;border-bottom:1px solid #334155}
td{padding:8px 10px;border-bottom:1px solid #283548}
tr:hover td{background:#263348}
</style></head>
<body><h1>Smart Manufacturing Pattern Discovery</h1><div id="kpis" class="kpis"></div><div id="panels" class="panels"></div>
<script>
var x=new XMLHttpRequest();x.open("GET","patterns.json",false);x.send();var d=JSON.parse(x.responseText);
function k(t,v){return"<div class=card><div class=kpi-title>"+t+"</div><div class=kpi>"+v+"</div></div>";}
var sc=d.sensor_relationships.filter(function(r){return r.strength=="Strong"&&r.sensor_x!=r.sensor_y;});
document.getElementById("kpis").innerHTML=k("Machines",d.machine_behaviour.length)+k("Strong Links",sc.length)+k("Assoc Rules",d.association_rules.length)+k("Anomalies",d.anomalies_detected.length);
function tbl(t,r){if(!r.length)return"";var ks=Object.keys(r[0]),h="<tr>";ks.forEach(function(c){h+="<th>"+c+"</th>";});h+="</tr>";r.slice(0,8).forEach(function(row){h+="<tr>";ks.forEach(function(c){h+="<td>"+row[c]+"</td>";});h+="</tr>";});return"<div class=card><h3>"+t+"</h3><table>"+h+"</table></div>";}
var p=document.getElementById("panels");
p.innerHTML=tbl("Machine Behaviour",d.machine_behaviour)+tbl("Sensor Links",sc)+tbl("Association Rules",d.association_rules)+tbl("Production Efficiency",d.production_patterns)+tbl("Temporal Shifts",d.temporal_patterns)+tbl("Anomalies",d.anomalies_detected);
</script></body></html>
